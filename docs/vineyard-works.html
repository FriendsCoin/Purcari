<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purcari · Vineyard works / Lucrări în vie / Работы на винограднике</title>
<style>
  :root {
    --ground:#ecefe4; --surface:#f6f7f0; --surface-2:#e6ead9;
    --ink:#1b231a; --ink-soft:#4a5442; --ink-faint:#71795f; --line:#d2d8c3;
    --vine:#2e5a38; --vine-deep:#1d3f26; --gold:#a5761f; --gold-soft:#f0e6cd;
    --hi:#a53c2d; --med:#a5761f; --low:#416389;
    --spring:#4e7a3b; --summer:#bd881b; --autumn:#a2502f; --winter:#416389; --year:#6a487a;
    --shadow:0 1px 2px rgba(27,35,26,.06),0 8px 24px -12px rgba(27,35,26,.22);
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#12160e; --surface:#1b2016; --surface-2:#232a1c;
      --ink:#e9ecdd; --ink-soft:#aab19a; --ink-faint:#7f8770; --line:#333b2a;
      --vine:#74ab7c; --vine-deep:#93c39a; --gold:#d3a748; --gold-soft:#33301f;
      --hi:#d97363; --med:#d3a748; --low:#7ba3cd;
      --spring:#7cae5f; --summer:#d9ac47; --autumn:#d07f57; --winter:#7ba3cd; --year:#ac86bd;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --ground:#ecefe4; --surface:#f6f7f0; --surface-2:#e6ead9;
    --ink:#1b231a; --ink-soft:#4a5442; --ink-faint:#71795f; --line:#d2d8c3;
    --vine:#2e5a38; --vine-deep:#1d3f26; --gold:#a5761f; --gold-soft:#f0e6cd;
    --hi:#a53c2d; --med:#a5761f; --low:#416389;
    --spring:#4e7a3b; --summer:#bd881b; --autumn:#a2502f; --winter:#416389; --year:#6a487a;
    --shadow:0 1px 2px rgba(27,35,26,.06),0 8px 24px -12px rgba(27,35,26,.22);
  }
  :root[data-theme="dark"]{
    --ground:#12160e; --surface:#1b2016; --surface-2:#232a1c;
    --ink:#e9ecdd; --ink-soft:#aab19a; --ink-faint:#7f8770; --line:#333b2a;
    --vine:#74ab7c; --vine-deep:#93c39a; --gold:#d3a748; --gold-soft:#33301f;
    --hi:#d97363; --med:#d3a748; --low:#7ba3cd;
    --spring:#7cae5f; --summer:#d9ac47; --autumn:#d07f57; --winter:#7ba3cd; --year:#ac86bd;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--vine) 8%,transparent),transparent 60%),var(--ground);
    color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .app{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:14px;min-height:100vh;}

  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em;}
  .brand .mark{width:30px;height:30px;border-radius:8px;flex:none;background:var(--vine);color:#fff;display:grid;place-items:center;font-size:17px;}
  .brand small{display:block;font-size:11px;color:var(--ink-faint);font-weight:500;letter-spacing:.1em;text-transform:uppercase;}
  .topbar .spacer{flex:1;}
  .langsw{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;}
  .langsw button{border:none;background:none;padding:5px 10px;border-radius:6px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink-faint);cursor:pointer;}
  .langsw button.on{background:var(--vine);color:#fff;}
  .theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .theme-btn:hover{border-color:var(--vine);color:var(--vine);}
  .progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress i{display:block;height:100%;background:var(--vine);transition:width .35s ease;}

  .deck{position:relative;height:min(74vh,660px);}
  @media (max-width:720px){.deck{height:auto;}}
  .slide{
    position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:clamp(20px,3vw,40px);overflow-y:auto;
    opacity:0;visibility:hidden;transform:translateY(6px);
    transition:opacity .34s ease,transform .34s ease,visibility .34s;
  }
  .slide.active{opacity:1;visibility:visible;transform:none;}
  @media (max-width:720px){
    .slide{position:static;opacity:1;visibility:visible;transform:none;display:none;}
    .slide.active{display:block;}
  }

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:10px;margin:0 0 14px;}
  .eyebrow .idx{color:var(--vine);font-weight:600;}
  .eyebrow .rule{flex:1;height:1px;background:var(--line);}

  h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;line-height:1.1;margin:0;}
  .slide h2{font-size:clamp(24px,3.4vw,38px);color:var(--ink);letter-spacing:-.01em;}
  p{line-height:1.55;}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .chip.zone{font-family:var(--mono);font-weight:600;color:var(--vine);}
  .pri{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap;}
  .pri.high{background:var(--hi);} .pri.medium{background:var(--med);} .pri.low{background:var(--low);}

  .cover{display:flex;flex-direction:column;height:100%;}
  .cover .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;}
  .cover h1{font-size:clamp(32px,5.6vw,64px);letter-spacing:-.02em;}
  .cover h1 .accent{color:var(--vine);font-style:italic;}
  .cover .lede{font-size:clamp(15px,1.8vw,19px);color:var(--ink-soft);max-width:62ch;line-height:1.5;}
  .cover .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink-faint);font-family:var(--mono);}
  .cover .meta b{color:var(--ink);font-weight:600;}
  .vine-emblem{width:46px;height:46px;color:var(--vine);}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  @media (max-width:820px){.kpis{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .kpi .v{font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);color:var(--vine-deep);font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px;font-weight:600;color:var(--ink);margin-top:2px;}
  .kpi .h{font-size:11px;color:var(--ink-faint);margin-top:2px;line-height:1.3;}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:720px){.cols2{grid-template-columns:1fr;gap:16px;}}
  .findlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
  .findlist li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-soft);line-height:1.45;}
  .findlist li::before{content:"";width:7px;height:7px;margin-top:7px;border-radius:50%;background:var(--vine);flex:none;}
  .findlist.data b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .panel h3{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .panel h3 .dot{width:8px;height:8px;border-radius:2px;}

  .lead{color:var(--ink-soft);font-size:14.5px;margin:14px 0 16px;max-width:80ch;line-height:1.5;}

  /* systems */
  .sysgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  @media (max-width:900px){.sysgrid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.sysgrid{grid-template-columns:repeat(2,1fr);}}
  .syscard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;}
  .syscard.hl{border-color:color-mix(in srgb,var(--vine) 45%,var(--line));background:color-mix(in srgb,var(--vine) 8%,var(--surface-2));}
  .syscard .ico{font-size:26px;line-height:1;}
  .syscard b{font-size:14px;color:var(--ink);}
  .syscard p{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.4;}
  .syscard .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--vine);}

  /* zone map */
  .zonemap{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start;}
  @media (max-width:720px){.zonemap{grid-template-columns:1fr;}}
  .mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .mapwrap svg{width:auto;max-width:100%;max-height:326px;height:auto;display:block;margin:0 auto;}
  .maptitle{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:2px 2px 8px;}
  .mapnote{font-size:11.5px;color:var(--ink-faint);margin:8px 2px 0;line-height:1.4;}
  .mapwrap.sm svg{max-height:246px;}
  .dmaps{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:720px){.dmaps{grid-template-columns:1fr;}}
  .dmap .maptitle{margin-bottom:6px;}
  .insight{margin-top:14px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-radius:12px;padding:11px 15px;font-size:13px;color:var(--ink);line-height:1.45;}
  .alegwrap{display:flex;flex-direction:column;gap:10px;justify-content:center;}
  .aleg{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft);line-height:1.4;}
  .aleg .sw{width:14px;height:14px;border-radius:4px;flex:none;margin-top:2px;}
  .aleg b{color:var(--ink);}
  .zlegend{display:flex;flex-direction:column;gap:10px;}
  .zonecard{border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:var(--surface-2);}
  .zonecard .tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .zonecard.core .tag{color:var(--vine);} .zonecard.mid .tag{color:var(--med);} .zonecard.edge .tag{color:var(--hi);}
  .zonecard h3{font-family:var(--sans);font-size:15px;margin:4px 0 7px;}
  .zonecard p{font-size:13px;color:var(--ink-soft);margin:6px 0 0;line-height:1.4;}
  .hotspots{display:flex;flex-wrap:wrap;gap:6px;}
  .hs{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);}
  .zonecard.core .hs{color:var(--vine);border-color:color-mix(in srgb,var(--vine) 40%,var(--line));}
  .zonecard.mid .hs{color:var(--med);}
  .zonecard.edge .hs{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 40%,var(--line));}

  /* technique */
  .tech-head{display:flex;align-items:flex-start;gap:16px;}
  .tech-ico{font-size:40px;line-height:1;flex:none;}
  .tech-head .grow{flex:1;}
  .tech-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;}
  .tech-summary{color:var(--ink-soft);font-size:14.5px;margin:14px 0 18px;max-width:80ch;line-height:1.5;}
  .tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:720px){.tech-grid{grid-template-columns:1fr;}}
  .why .dot{background:var(--low);} .what .dot{background:var(--vine);}
  .why ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .why li{font-size:13.5px;color:var(--ink-soft);line-height:1.45;padding-left:14px;position:relative;}
  .why li::before{content:"–";position:absolute;left:0;color:var(--low);}
  .why b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .works{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .work{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);line-height:1.4;}
  .season{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;margin-top:1px;min-width:74px;text-align:center;}
  .s-spring{background:var(--spring);} .s-summer{background:var(--summer);} .s-autumn{background:var(--autumn);} .s-winter{background:var(--winter);} .s-year{background:var(--year);}
  .benefit{margin-top:16px;background:color-mix(in srgb,var(--vine) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--vine) 26%,var(--line));border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--ink);display:flex;gap:10px;align-items:flex-start;}
  .benefit b{color:var(--vine-deep);}

  /* calendar */
  .calgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  @media (max-width:900px){.calgrid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.calgrid{grid-template-columns:1fr;}}
  .calcol{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);}
  .calcol header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
  .calcol header b{font-family:var(--serif);font-size:16px;}
  .calcol header .n{font-family:var(--mono);font-size:12px;color:var(--ink-faint);}
  .calcol.c-spring{border-top:3px solid var(--spring);} .calcol.c-summer{border-top:3px solid var(--summer);}
  .calcol.c-autumn{border-top:3px solid var(--autumn);} .calcol.c-winter{border-top:3px solid var(--winter);}
  .calcol.c-year{border-top:3px solid var(--year);}
  .calcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .calcol li{font-size:11px;color:var(--ink-soft);line-height:1.32;padding-left:12px;position:relative;}
  .calcol li::before{content:"·";position:absolute;left:2px;color:var(--ink-faint);font-weight:700;}

  /* roadmap */
  .road{display:flex;flex-direction:column;gap:14px;}
  .roadrow{display:grid;grid-template-columns:156px 1fr;gap:16px;align-items:start;}
  @media (max-width:600px){.roadrow{grid-template-columns:1fr;gap:8px;}}
  .roadrow .when{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .roadrow .when .pri{font-size:10px;letter-spacing:.06em;}
  .roadrow .when .lab{font-family:var(--serif);font-size:18px;}
  .roadrow .items{display:flex;flex-wrap:wrap;gap:8px;}
  .ritem{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:8px;}
  .ritem .e{font-size:16px;}

  .close-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  @media (max-width:640px){.close-list{grid-template-columns:1fr;}}
  .close-list .item{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-soft);}
  .close-list .item b{color:var(--ink);}
  .source{margin-top:22px;font-size:12px;color:var(--ink-faint);font-family:var(--mono);line-height:1.4;}

  .nav{display:flex;align-items:center;gap:12px;}
  .nav .dots{flex:1;display:flex;flex-wrap:wrap;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0;}
  .dot.on{background:var(--vine);transform:scale(1.15);}
  .navbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 15px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .navbtn:hover:not(:disabled){border-color:var(--vine);color:var(--vine);}
  .navbtn:disabled{opacity:.4;cursor:default;}
  .counter{font-family:var(--mono);font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;min-width:56px;text-align:center;}
  :focus-visible{outline:2px solid var(--vine);outline-offset:2px;border-radius:4px;}

  @media (prefers-reduced-motion:reduce){.slide,.progress i,.dot{transition:none !important;}}
  @media print{
    .topbar,.theme-btn,.langsw,.nav,.progress{display:none !important;}
    .app{max-width:none;padding:0;gap:0;min-height:0;}
    .deck{height:auto;position:static;}
    .slide{position:static;opacity:1;visibility:visible;transform:none;overflow:visible;
      page-break-after:always;break-after:page;box-shadow:none;border:none;border-radius:0;margin:0;
      min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:44px 56px;}
    .slide:last-child{page-break-after:auto;break-after:auto;}
    .cover{justify-content:flex-start;}
  }
</style>
</head>
<body>


<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">🍇</span>
      <span>Château&nbsp;Purcari<small id="brandSub">Vineyard · biodiversity</small></span>
    </div>
    <span class="spacer"></span>
    <div class="langsw" id="langsw" role="tablist" aria-label="Language">
      <button data-lang="ru">RU</button><button data-lang="ro">RO</button><button data-lang="en">EN</button>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Theme">◑ <span id="themeLbl">Theme</span></button>
  </div>
  <div class="progress"><i id="prog"></i></div>

  <div class="deck" id="deck" aria-live="polite"></div>

  <div class="nav">
    <button class="navbtn" id="prev">← Back</button>
    <span class="counter" id="counter">1 / 1</span>
    <button class="navbtn" id="next">Next →</button>
    <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Hotspot layout (relative positions faithful to the estate's satellite map, north-up) + zone.
  // Coordinate frame anchored to the real GPS extent recorded on site:
  //   lon 29.865–29.882°E (x), lat 46.534–46.500°N (y, top→bottom). Placement is approximate.
  var NODES = [
    {id:'H10',x:50,y:12,z:'mid'}, {id:'HC',x:65,y:13,z:'edge'},
    {id:'H13',x:44,y:22,z:'core'}, {id:'H9',x:60,y:30,z:'core'},
    {id:'H1',x:62,y:40,z:'core'}, {id:'H4',x:25,y:41,z:'edge'},
    {id:'H11',x:30,y:56,z:'core'}, {id:'H12',x:58,y:57,z:'mid'},
    {id:'H7',x:67,y:63,z:'mid'}, {id:'H14',x:55,y:67,z:'core'},
    {id:'H5',x:44,y:75,z:'mid'}, {id:'H6',x:54,y:90,z:'edge'}
  ];
  var NODEBY = {}; NODES.forEach(function(n){ NODEBY[n.id]=n; });
  var ZCOL = {core:'var(--vine)', mid:'var(--med)', edge:'var(--hi)'};
  var BOUNDARY = "M48,5 L67,9 L71,26 L67,45 L73,58 L70,71 L60,95 L49,97 L45,80 L28,66 L22,50 L21,34 L31,15 Z";
  // Per-hotspot totals read from the final report bar charts (approximate).
  var CAM = {H13:1100,H1:920,H14:680,H11:530,H9:430,H4:285,H12:195,H5:150,H6:120,H10:110,HC:8,H7:6};
  var SND = {H10:7800,HC:3900,H12:3800,H1:3650,H13:3300,H7:1500,H11:1400,H5:1050,H6:1000,H4:950,H14:950,H9:850};

  var _uid = 0;
  function mapFrame(uid, extras, opts){
    opts = opts || {};
    var north = '<g transform="translate(90,13)" fill="var(--ink-faint)">'+
      '<path d="M0,-5 L2.3,4 L0,1.4 L-2.3,4 Z"/>'+
      '<text x="0" y="-6.2" text-anchor="middle" font-size="3.6" font-family="var(--mono)">N</text></g>';
    var ticks = '';
    if (opts.ticks){
      ticks =
        '<text x="24" y="99.2" text-anchor="middle" font-size="2.5" font-family="var(--mono)" fill="var(--ink-faint)">29.87°E</text>'+

  function nodeDot(n, r, fill, showLabel, labelSize){
    var g = '<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+fill+'" stroke="var(--surface)" stroke-width="0.6"/>';
    if (showLabel){
      g += '<text x="'+n.x+'" y="'+(n.y-r-1.2)+'" text-anchor="middle" font-family="var(--mono)" font-size="'+(labelSize||3.05)+'" '+
        'font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="0.9" paint-order="stroke">'+n.id+'</text>';
    }
    return g;
  }
  // Zone map (used on the priority slide)
  function buildMap(){
    var uid = ++_uid;
    var pts = NODES.map(function(n){ return nodeDot(n, 2.5, ZCOL[n.z], true, 3.05); }).join('');
    return mapFrame(uid, pts, {ticks:true, label:'Monitoring hotspots by zone'});
  }
  // Proportional-symbol map (activity by hotspot)
  function buildSizeMap(vals, color){
    var uid = ++_uid;
    var maxv = Math.max.apply(null, Object.keys(vals).map(function(k){ return vals[k]; }));
    var pts = NODES.slice().sort(function(a,b){ return (vals[b.id]||0)-(vals[a.id]||0); }).map(function(n){
      var v = vals[n.id]||0;
      var r = 1.4 + Math.sqrt(v/maxv)*5.2;
      var big = v/maxv > 0.55;
      return '<g>'+nodeDot(n, r, color, big, 3)+'</g>';
    }).join('');
    return mapFrame(uid, pts, {label:'Detections by hotspot'});
  }
  // Action map (where each work happens)
  function buildActionMap(){
    var uid = ++_uid;
    function curve(a,b){ var A=NODEBY[a],B=NODEBY[b]; var mx=(A.x+B.x)/2+(B.y-A.y)*0.18, my=(A.y+B.y)/2-(B.x-A.x)*0.18;
      return 'M'+A.x+','+A.y+' Q'+mx+','+my+' '+B.x+','+B.y; }
    var defs = '<marker id="arr'+uid+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">'+
      '<path d="M0,0 L10,5 L0,10 z" fill="var(--vine)"/></marker>';
    // core protective halos
    var halos = NODES.filter(function(n){return n.z==='core';}).map(function(n){
      return '<circle cx="'+n.x+'" cy="'+n.y+'" r="5.4" fill="var(--vine)" opacity="0.12"/>'; }).join('');
    // corridors edge -> core
    var corr = [['H4','H11'],['H6','H14'],['HC','H9']].map(function(p){
      return '<path d="'+curve(p[0],p[1])+'" fill="none" stroke="var(--vine)" stroke-width="0.9" stroke-dasharray="2.4 1.8" marker-end="url(#arr'+uid+')" opacity="0.85"/>';
    }).join('');
    // riparian buffer (central-south corridor)
    var rip = '<path d="M36,58 Q44,74 54,92" fill="none" stroke="var(--low)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 2.6" opacity="0.75"/>';
    // boar-risk wood edge (SE)
    var boar = '<path d="M60,58 Q69,63 60,71" fill="none" stroke="var(--hi)" stroke-width="1.3" stroke-dasharray="2 1.6" opacity="0.8"/>';
    var pts = NODES.map(function(n){ return nodeDot(n, 2.2, ZCOL[n.z], true, 2.9); }).join('');
    return mapFrame(uid, halos+corr+rip+boar+pts, {ticks:true, defs:defs, label:'Where each work happens'});
  }

      eyebrow(idx, D.dat.eyebrow)+'<h2>'+D.dat.h2+'</h2>'+
      '<p class="lead">'+D.dat.summary+'</p>'+
      '<div class="dmaps">'+
        '<div class="dmap"><div class="maptitle">'+D.dat.camTitle+'</div><div class="mapwrap sm">'+buildSizeMap(CAM,'var(--vine)')+'</div>'+
          '<p class="mapnote"><b>'+D.dat.topLbl+':</b> '+camTop.join(', ')+'</p></div>'+
        '<div class="dmap"><div class="maptitle">'+D.dat.sndTitle+'</div><div class="mapwrap sm">'+buildSizeMap(SND,'var(--low)')+'</div>'+
          '<p class="mapnote"><b>'+D.dat.topLbl+':</b> '+sndTop.join(', ')+'</p></div>'+
      '</div>'+
      '<div class="insight">💡 '+D.dat.insight+'</div></section>';
  }
  function slideAction(D,idx){
    var leg = D.act.legend.map(function(l){
      return '<div class="aleg"><span class="sw" style="background:'+l.c+'"></span><div><b>'+l.t+'</b> <span>'+l.d+'</span></div></div>';
    }).join('');
    return '<section class="slide" role="group" aria-label="'+esc(D.act.h2)+'">'+
      eyebrow(idx, D.act.eyebrow)+'<h2>'+D.act.h2+'</h2>'+
      '<p class="lead">'+D.act.summary+'</p>'+
      '<div class="zonemap"><div><div class="maptitle">'+D.act.mapTitle+'</div>'+
        '<div class="mapwrap">'+buildActionMap()+'</div><p class="mapnote">'+D.act.note+'</p></div>'+
        '<div class="alegwrap">'+leg+'</div></div></section>';
  }
  function slideTech(D,t,idx,i){
    var Sn = D.seasons;
    var scls = {spring:'s-spring',summer:'s-summer',autumn:'s-autumn',winter:'s-winter',year:'s-year'};
    var zones = t.zones.map(function(z){ return '<span class="chip zone">'+z+'</span>'; }).join('');
    var why = t.why.map(function(w){ return '<li>'+w+'</li>'; }).join('');
    var works = t.works.map(function(w){
      return '<li class="work"><span class="season '+scls[w[0]]+'">'+Sn[w[0]]+'</span><span>'+w[1]+'</span></li>';
    }).join('');
    return '<section class="slide" role="group" aria-label="'+esc(t.title)+'">'+
      eyebrow(idx, D.practice+' · '+t.cat, (i+1)+'/9')+
      '<div class="tech-head"><span class="tech-ico">'+t.icon+'</span><div class="grow">'+
        '<h2>'+t.title+'</h2><div class="tech-meta"><span class="pri '+t.pri+'">'+D.pri[t.pri]+'</span>'+zones+'</div></div></div>'+
      '<p class="tech-summary">'+t.summary+'</p>'+
      '<div class="tech-grid">'+
        '<div class="panel why"><h3><span class="dot"></span> '+D.whyH+'</h3><ul>'+why+'</ul></div>'+
        '<div class="panel what"><h3><span class="dot"></span> '+D.whatH+'</h3><ul class="works">'+works+'</ul></div>'+
      '</div>'+
      '<div class="benefit">✓ <span><b>'+D.benefitH+'.</b> '+t.benefit+'</span></div></section>';
  }
  function slideCal(D,idx){
    var cols = D.cal.cols.map(function(c){
      var li = c.items.map(function(x){ return '<li>'+x+'</li>'; }).join('');
      return '<div class="calcol '+c.cls+'"><header><b>'+c.name+'</b><span class="n">'+c.n+'</span></header><ul>'+li+'</ul></div>';
    }).join('');
    return '<section class="slide" role="group" aria-label="'+esc(D.cal.h2)+'">'+
      eyebrow(idx, D.cal.eyebrow)+'<h2>'+D.cal.h2+'</h2>'+
      '<p class="lead">'+D.cal.summary+'</p><div class="calgrid">'+cols+'</div></section>';
  }
  function slideRoad(D,idx){
    var rows = D.road.rows.map(function(r){
      var items = r.items.map(function(it){ return '<span class="ritem"><span class="e">'+it[0]+'</span> '+it[1]+'</span>'; }).join('');
      return '<div class="roadrow"><div class="when"><span class="pri '+r.pri+'">'+r.when+'</span><span class="lab">'+r.lab+'</span></div>'+
        '<div class="items">'+items+'</div></div>';
    }).join('');
    return '<section class="slide" role="group" aria-label="'+esc(D.road.h2)+'">'+
      eyebrow(idx, D.road.eyebrow)+'<h2>'+D.road.h2+'</h2>'+
      '<p class="lead">'+D.road.summary+'</p><div class="road">'+rows+'</div></section>';
  }
  function slideClose(D,idx){
    var items = D.close.items.map(function(x){ return '<div class="item">'+x[0]+' <span><b>'+x[1]+'</b> '+x[2]+'</span></div>'; }).join('');
    return '<section class="slide" role="group" aria-label="'+esc(D.close.h2)+'">'+
      eyebrow(idx, D.close.eyebrow)+'<h2>'+D.close.h2+'</h2>'+
      '<div class="close-list">'+items+'</div><p class="source">'+D.close.source+'</p></section>';
  }

  function buildDeck(D){
    var html = [];
    html.push(slideCover(D));
    var n = 1;
    html.push(slideWhy(D, pad(n++)));
    html.push(slideEv(D, pad(n++)));
    html.push(slideSys(D, pad(n++)));
    html.push(slideZones(D, pad(n++)));
    html.push(slideActivity(D, pad(n++)));
    html.push(slideAction(D, pad(n++)));
    D.tech.forEach(function(t,i){ html.push(slideTech(D,t,pad(n++),i)); });
    html.push(slideCal(D, pad(n++)));
    html.push(slideRoad(D, pad(n++)));
    html.push(slideClose(D, pad(n++)));
    return html.join('');
  }

  // ---------- app state ----------
  var lang = 'ru', cur = 0;
  var deck = document.getElementById('deck');
  var prog = document.getElementById('prog');
  var counter = document.getElementById('counter');
  var prevB = document.getElementById('prev');
  var nextB = document.getElementById('next');
  var dotsWrap = document.getElementById('dots');
  var slides = [], dots = [];

  function mount(){
    var D = DECK[lang];
    document.documentElement.lang = lang;
    document.getElementById('brandSub').textContent = D.brandSub;
    document.getElementById('themeLbl').textContent = D.theme;
    prevB.textContent = D.back; nextB.textContent = D.next;
    Array.prototype.forEach.call(document.querySelectorAll('#langsw button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    deck.innerHTML = buildDeck(D);
    slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
    dotsWrap.innerHTML = '';
    dots = slides.map(function(_, i){
      var d = document.createElement('button');
      d.className = 'dot'; d.setAttribute('role','tab'); d.setAttribute('aria-label','Slide '+(i+1));
      d.addEventListener('click', function(){ go(i); });
      dotsWrap.appendChild(d);
      return d;
    });
    if (cur > slides.length - 1) cur = slides.length - 1;
    render();
  }
  function render(){
    slides.forEach(function(s,i){ var on = i===cur; s.classList.toggle('active',on); s.setAttribute('aria-hidden',on?'false':'true'); if(on) s.scrollTop=0; });
    dots.forEach(function(d,i){ d.classList.toggle('on', i===cur); });
    counter.textContent = (cur+1)+' / '+slides.length;
    prog.style.width = ((cur+1)/slides.length*100)+'%';
    prevB.disabled = cur===0; nextB.disabled = cur===slides.length-1;
  }
  function go(i){ cur = Math.max(0, Math.min(slides.length-1, i)); render(); }

  prevB.addEventListener('click', function(){ go(cur-1); });
  nextB.addEventListener('click', function(){ go(cur+1); });
  document.addEventListener('keydown', function(e){
    if (e.target && /^(INPUT|TEXTAREA|BUTTON)$/.test(e.target.tagName) && (e.key===' '||e.key==='Enter')) return;
    if (e.key==='ArrowRight'||e.key==='PageDown') go(cur+1);
    else if (e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
    else if (e.key==='Home') go(0);
    else if (e.key==='End') go(slides.length-1);
  });
  var x0=null;
  deck.addEventListener('touchstart', function(e){ x0=e.touches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', function(e){
    if (x0===null) return; var dx=e.changedTouches[0].clientX-x0;
    if (Math.abs(dx)>55) go(cur+(dx<0?1:-1)); x0=null;
  }, {passive:true});

  Array.prototype.forEach.call(document.querySelectorAll('#langsw button'), function(b){
    b.addEventListener('click', function(){ lang = b.getAttribute('data-lang'); mount(); });
  });
  document.getElementById('themeBtn').addEventListener('click', function(){
    var root = document.documentElement;
    var isDark = root.getAttribute('data-theme')==='dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  mount();
})();
</script>

</body>
</html>
