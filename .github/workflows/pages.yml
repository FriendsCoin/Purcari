name: Deploy installation preview

# Publishes the whole site — the analytical dashboard and the installation — in
# one deployment, which is how the outdoor piece gets tested on a real phone:
# browsers only grant camera and microphone access over HTTPS.
#
# One deployment, deliberately. GitHub Pages serves whatever the last successful
# deployment uploaded and nothing else, so two workflows publishing two different
# trees do not merge — they take turns deleting each other. That is exactly what
# happened here: a second branch published `dist` alone on 4 August and /live/
# returned 404 until this ran again, at which point the dashboard at the root
# went dark instead. Both belong to the same site, so both go in the same
# artifact and neither can win.
#
#   /              the dashboard (dist/index.html)
#   /indoor.html   the touchscreen piece, served from its own bundle
#   /outdoor.html  the sensor piece
#   /live/         the installation as one self-contained file, works offline
#   /stills/       press stills
#
# Pages must be switched on once by hand before this can run — set
# Settings → Pages → Source to "GitHub Actions". The automated routes are all
# closed: the Pages REST API is unreachable from the build sandbox, and the
# workflow's own GITHUB_TOKEN may deploy to an existing Pages site but not
# create one ("Resource not accessible by integration"), so `enablement: true`
# below cannot bootstrap it either. It is kept only so the setting is restored
# automatically if Pages is ever turned back off.

on:
  push:
    branches:
      - main
      - claude/interactive-media-art-dashboard-ki7oz7
    # No paths filter: the artifact now contains the built application as well
    # as docs/, so a change to src/ changes the site just as much as a change to
    # docs/ does. Filtering on docs/** would quietly publish a stale dashboard.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it — a half-deployed site is worse than a slightly stale one.
#
# The group is deliberately NOT called "pages". GitHub's own built-in
# `pages-build-deployment` workflow occupies that name, and with
# cancel-in-progress false this job queued behind it and was cancelled without
# ever being given a runner — every run since 3 August recorded zero steps
# executed and produced no logs, which reads as a broken workflow when in fact
# it never started.
concurrency:
  group: installation-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` is deliberately not set: a workflow's GITHUB_TOKEN may
      # deploy to an existing Pages site but cannot create one, so asking it to
      # only turns a clear "Pages is off" into a confusing permissions error.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Require Pages to be switched on
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository."
          {
            echo "### Pages is not enabled yet"
            echo ""
            echo "Open <https://github.com/${{ github.repository }}/settings/pages>"
            echo "and set **Source** to **GitHub Actions**, then re-run this workflow."
            echo ""
            echo "This is the one step that cannot be automated: the Pages REST API"
            echo "is unreachable from the build sandbox, and this workflow's token"
            echo "can deploy to an existing Pages site but not create one."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The site is served from a subpath, so the built asset URLs have to carry
      # it. Passed on the command line rather than written into vite.config.ts:
      # `base` is a property of where this one deployment lands, not of the
      # project, and hard-coding it would break `npm run dev` and any other host.
      - name: Build the dashboard and the two kiosk pages
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      # Assemble one tree. dist/ supplies the root; docs/ is laid over the top,
      # contributing /live/ and /stills/. The two do not overlap.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r dist/. _site/
          cp -r docs/live docs/stills _site/
          # Fail loudly rather than deploying half a site: a missing file here
          # is how the root or /live/ silently 404s.
          for f in _site/index.html _site/indoor.html _site/outdoor.html _site/live/index.html; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
          echo "assembled:"; find _site -maxdepth 2 -name '*.html' | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the URLs
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Dashboard | ${url} |"
            echo "| Installation, offline single file | ${url}live/ |"
            echo "| Touchscreen piece | ${url}indoor.html |"
            echo "| Sensor piece | ${url}outdoor.html |"
          } >> "$GITHUB_STEP_SUMMARY"
