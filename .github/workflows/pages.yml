name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/interactive-media-art-dashboard-d29fq7]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs supersede rather than cancel, so a push
# during a deploy still ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - name: Build site
        # Project sites live under /<repo>/, so the asset prefix has to match.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Build the single-file installation
        run: npm run build:standalone

      - name: Collect artefacts
        run: |
          # Jekyll would otherwise swallow files it does not recognise.
          touch dist/.nojekyll
          cp dist-standalone/purcari-living-archive.html dist/purcari-living-archive.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
